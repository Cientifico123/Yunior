      ? `Lo que marcaste puede orientar una hipótesis, no una certeza. Percibiste: ${dynamic.perceive.join(', ') || 'ninguna señal'}. Actuarías: ${dynamic.act.join(', ') || 'sin respuesta'}. El contexto, la línea base y la conversación deben confirmar o corregir esa lectura.`

    action: LEVEL_ACTIONS[module.id],
  };
}

function getDominant(tally) {
  if (!tally) return null;
  let best = null, bestVal = -1;
  for (const k of Object.keys(tally)) { if (tally[k] > bestVal) { bestVal = tally[k]; best = k; } }
  return best;
}

function isQuestionCorrect(mod, qi, ans) {
  const opts = mod.questions[qi].options;
  if (mod.multi) {
    const correctSet = opts.map((o, i) => (o.correct ? i : null)).filter((x) => x !== null).sort();
    const selSet = (Array.isArray(ans) ? [...ans] : []).sort();
    return correctSet.length === selSet.length && correctSet.every((v, idx) => v === selSet[idx]);
  }
  return ans !== null && !!opts[ans]?.correct;
}

function emptyAnswers(mod) {
  return Array(mod.questions.length).fill(mod.multi ? [] : null);
}

  const isMulti = !!currentModule.multi;
  const isQuiz = currentModule.type === 'quiz';
  const hasAnswer = isMulti ? Array.isArray(currentAnswer) && currentAnswer.length > 0 : currentAnswer !== null;
  const hasSignals = (moduleSignals[currentModule.id] || []).length > 0;
  const dynamicKey = `${currentModule.id}-${questionIndex}`;
  const currentDynamicMarks = dynamicMarks[dynamicKey] || { perceive: [], act: [] };
  const hasDynamicMarks = currentDynamicMarks.perceive.length > 0 || currentDynamicMarks.act.length > 0;
  const canContinue = hasAnswer && currentDynamicMarks.perceive.length > 0 && currentDynamicMarks.act.length > 0;
  const allDone = completedModules.length === MODULES.length;

  const solvedQuestions = completedModules.reduce(
    (n, id) => n + MODULES.find((m) => m.id === id).questions.length, 0
  );
  const inProgress = screen === 'question' && !completedModules.includes(currentModule.id) ? questionIndex : 0;
  const readingPct = screen === 'intro' ? 0 : Math.min(100, ((solvedQuestions + inProgress) / TOTAL_QUESTIONS) * 100);

  function startModule(idx) {
    setDirection('forward');
    setModuleIndex(idx);
    setQuestionIndex(0);
    setAnswers(emptyAnswers(MODULES[idx]));
    setChecked(false);
    setScreen('question');
  }

  function selectOption(i) {
    if (isQuiz && checked) return; // locked once verified
    setAnswers((prev) => prev.map((a, idx) => {
      if (idx !== questionIndex) return a;
      if (isMulti) {
        const arr = Array.isArray(a) ? a : [];
        return arr.includes(i) ? arr.filter((x) => x !== i) : [...arr, i];
      }
      return i;
    }));
  }

  function handleVerify() {
    if (!hasAnswer) return;
    setChecked(true);
  }

  function goBackQuestion() {
    setDirection('backward');
    setChecked(false);
    if (questionIndex > 0) setQuestionIndex((q) => q - 1);
    else setScreen('map');
  }

  function goForwardQuestion() {
    if (!canContinue) return;
    if (isQuiz && !checked) { handleVerify(); return; }
    setDirection('forward');
    if (questionIndex < currentModule.questions.length - 1) {
      setQuestionIndex((q) => q + 1);
      setChecked(false);
    } else if (isQuiz) {
      let correct = 0;
      answers.forEach((ans, qi) => { if (isQuestionCorrect(currentModule, qi, ans)) correct += 1; });
      setModuleScores((prev) => ({ ...prev, [currentModule.id]: { correct, total: currentModule.questions.length } }));
      setCompletedModules((prev) => (prev.includes(currentModule.id) ? prev : [...prev, currentModule.id]));
      setScreen('moduleSummary');
    } else {
      const tally = {};
      answers.forEach((ansIdx, qi) => {
        const option = currentModule.questions[qi].options[ansIdx];
        if (option?.trait) tally[option.trait] = (tally[option.trait] || 0) + 1;
      });
      setScores((prev) => {
        const next = { ...prev };
        const old = moduleScores[currentModule.id];
        if (old && !old.total) { for (const k in old) next[k] = (next[k] || 0) - old[k]; }
        for (const k in tally) next[k] = (next[k] || 0) + tally[k];
        return next;
      });
      setModuleScores((prev) => ({ ...prev, [currentModule.id]: tally }));
      setCompletedModules((prev) => (prev.includes(currentModule.id) ? prev : [...prev, currentModule.id]));
      setScreen('moduleSummary');
    }
  }

  function backToLastQuestion() {
    setDirection('backward');
    setChecked(isQuiz); // answers already committed; show them checked again
    setQuestionIndex(currentModule.questions.length - 1);
    setScreen('question');
  }

  function goNextModuleOrFinal() {
    setDirection('forward');
    if (allDone) { setScreen('final'); return; }
    if (moduleIndex < MODULES.length - 1) { startModule(moduleIndex + 1); return; }
    const firstPending = MODULES.findIndex((m) => !completedModules.includes(m.id));
    if (firstPending !== -1) startModule(firstPending); else setScreen('final');
  }

  function resetAll() {
    setScreen('intro');
    setModuleIndex(0);
    setQuestionIndex(0);
    setAnswers([null, null, null]);
    setChecked(false);
    setModuleScores({});
    setCompletedModules([]);
    setScores(EMPTY_SCORES);
    setDirection('forward');
    setModuleSignals({});
    setDynamicMarks({});
  }

  function toggleModuleSignal(signal) {
    setModuleSignals((prev) => {
      const current = prev[currentModule.id] || [];
      const next = current.includes(signal) ? current.filter((item) => item !== signal) : [...current, signal];
      return { ...prev, [currentModule.id]: next };
    });
  }

  function toggleDynamicMark(type, value) {
    setDynamicMarks((prev) => {
      const current = prev[dynamicKey] || { perceive: [], act: [] };
      const values = current[type].includes(value)
        ? current[type].filter((item) => item !== value)
        : [...current[type], value];
      return { ...prev, [dynamicKey]: { ...current, [type]: values } };
    });
  }

  function getAllDynamicMarks(moduleId) {
    const marks = Object.entries(dynamicMarks)
      .filter(([key]) => key.startsWith(`${moduleId}-`))
      .map(([, value]) => value);
    return {
      perceive: marks.flatMap((value) => value.perceive),
      act: marks.flatMap((value) => value.act),
    };
  }

  const pageKey = `${screen}-${moduleIndex}-${questionIndex}`;
  const pageClass = direction === 'forward' ? 'page-forward' : 'page-back';

  return (
    <div
      className="min-h-screen w-full flex flex-col relative"
      style={{
        background: 'radial-gradient(ellipse 90% 55% at 50% -8%, #10203C 0%, #081326 55%, #050B18 100%)',
        color: '#EDE3C8',
        fontFamily: "ui-sans-serif, system-ui, -apple-system, sans-serif",
      }}
    >
      <style>{`
        .font-display { font-family: ui-serif, Georgia, 'Times New Roman', serif; }
        @keyframes slideInRight { from { opacity:0; transform: translateX(18px);} to { opacity:1; transform: translateX(0);} }
        @keyframes slideInLeft { from { opacity:0; transform: translateX(-18px);} to { opacity:1; transform: translateX(0);} }
        .page-forward { animation: slideInRight .38s cubic-bezier(.2,.7,.3,1) both; }
        .page-back { animation: slideInLeft .38s cubic-bezier(.2,.7,.3,1) both; }
        @keyframes glow { 0%,100% { opacity:.4; } 50% { opacity:.7; } }
        .glow-pulse { animation: glow 7s ease-in-out infinite; }
        @media (prefers-reduced-motion: reduce) {
          .page-forward, .page-back, .glow-pulse { animation: none !important; }
        }
        ::selection { background: rgba(212,175,55,0.35); }
        .cover-grid { background: linear-gradient(110deg, rgba(16,32,60,0.42), rgba(5,11,24,0.08)); }
        .cover-line { background: linear-gradient(90deg, #D4AF37, rgba(212,175,55,0)); }
        .signal-card { background: rgba(147,162,192,0.055); border: 1px solid rgba(147,162,192,0.16); }
        .signal-card:hover { border-color: rgba(212,175,55,0.5); transform: translateY(-2px); }
        @media (max-width: 640px) {
          .cover-grid { grid-template-columns: 1fr; }
          .cover-signals { border-left: 0 !important; border-top: 1px solid rgba(212,175,55,0.22); padding-left: 0 !important; padding-top: 2rem; }
        }
      `}</style>

      {screen !== 'intro' && <ReadingBar pct={readingPct} />}

      {/* ---------------- INTRO ---------------- */}
      {screen === 'intro' && (
        <div className="flex-1 flex items-center justify-center px-5 sm:px-8 py-10 sm:py-16 relative overflow-hidden">
          <div className="cover-grid relative grid grid-cols-2 gap-12 max-w-6xl w-full p-2 sm:p-8 lg:p-14 page-forward" style={{ borderLeft: '3px solid #D4AF37' }}>
            <div className="flex flex-col justify-between min-h-[480px]">
              <div>
                <div className="flex items-center gap-3 mb-10" style={{ color: '#D4AF37' }}>
                  <span className="w-9 h-px" style={{ background: '#D4AF37' }} />
                  <span className="text-[10px] tracking-[0.28em] uppercase font-semibold">Experiencia interactiva · 2026</span>
                </div>
                <p className="text-[13px] tracking-[0.28em] uppercase mb-4" style={{ color: '#93A2C0' }}>Conócete · 2026</p>
                <h1 className="font-display text-5xl sm:text-7xl lg:text-8xl leading-[0.92] mb-7" style={{ color: '#F0D479' }}>
                  El lenguaje<br /><em>secreto</em><br />de tu cuerpo
                </h1>
                <div className="h-px w-44 mb-6 cover-line" />
                <p className="text-base sm:text-lg leading-relaxed max-w-lg" style={{ color: '#D7DCE8' }}>
                  Descubre lo que revelan tus gestos, indicios y microexpresiones, incluso aquello que no ves de ti mismo.
                </p>
              </div>
              <div className="mt-10">
                <button
                  onClick={() => setScreen('ethics')}
                  className="group inline-flex items-center gap-3 font-semibold text-sm px-7 py-4 rounded-full transition-transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-[#D4AF37]"
                  style={{ background: 'linear-gradient(135deg, #C9A227, #E8C860)', color: '#0A1428' }}
                >
                  Entrar a la experiencia
                  <ChevronRight size={17} className="group-hover:translate-x-0.5 transition-transform" />
                </button>
                <p className="text-[11px] mt-5 tracking-wide" style={{ color: '#5B6478' }}>
                  Una guía de observación y autoconocimiento basada en el libro de Yoeldis Castillo Quiala y Junior Coronel Durán.
                </p>
              </div>
            </div>

            <div className="cover-signals border-l pl-8 sm:pl-10 flex flex-col justify-center" style={{ borderColor: 'rgba(212,175,55,0.22)' }}>
              <div className="flex items-center justify-between mb-8">
                <span className="text-[11px] tracking-[0.25em] uppercase font-semibold" style={{ color: '#D4AF37' }}>Tu mapa de observación</span>
                <span className="font-display italic text-3xl" style={{ color: '#5B6478' }}>01—12</span>
              </div>
              <p className="text-sm leading-relaxed mb-6" style={{ color: '#D7DCE8' }}>
                <strong style={{ color: '#F0D479' }}>Microexpresiones e indicios</strong><br />
                Observa lo que aparece en el rostro y las señales del cuerpo que solo adquieren sentido cuando las relacionas con el contexto.
              </p>
              <div className="space-y-3">
                {[
                  [Smile, 'Microexpresiones', 'emociones que aparecen en el rostro'],
                  [Search, 'Indicios', 'señales que necesitan contexto'],
                  [Eye, 'Indicios + microexpresiones', 'cuando ambas señales coinciden'],
                  [Heart, 'Relaciones', 'interés, distancia y límites'],
                  [Sparkles, 'Reflejo final', 'tu patrón personal']
                ].map(([Icon, label, detail], index) => (
                  <div key={label} className="signal-card flex items-center gap-4 rounded-2xl p-4 transition-all duration-200">
                    <div className="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style={{ background: 'rgba(212,175,55,0.13)', color: '#D4AF37' }}>
                      <Icon size={18} />
                    </div>
                    <div>
                      <p className="font-display text-lg" style={{ color: '#EDE3C8' }}>{label}</p>
                      <p className="text-[12px]" style={{ color: '#93A2C0' }}>{detail}</p>
                    </div>
                    <span className="ml-auto text-[10px]" style={{ color: '#5B6478' }}>0{index + 1}</span>
                  </div>
                ))}
              </div>
              <p className="text-[12px] leading-relaxed mt-8" style={{ color: '#93A2C0' }}>
                En cada nivel puedes observar microexpresiones, identificar indicios y analizar qué ocurre cuando ambos aparecen juntos.
              </p>
            </div>
          </div>
        </div>
      )}

      {/* ---------------- ETHICS / PROPÓSITO ---------------- */}
      {screen === 'ethics' && (
        <div className="flex-1 flex items-center justify-center px-6 py-16 max-w-lg mx-auto w-full page-forward">
          <div className="w-full text-center">
            <div
              className="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-6"
              style={{ background: 'rgba(212,175,55,0.14)', color: '#D4AF37' }}
            >
              <Compass size={22} />
            </div>
            <h2 className="font-display italic text-3xl mb-6" style={{ color: '#F0D479' }}>
              Antes de empezar, una aclaración
            </h2>
            <div className="text-left space-y-4 text-[14px] leading-relaxed mb-10" style={{ color: '#D7DCE8' }}>
              <p>
                Esta es una app de <span style={{ color: '#D4AF37', fontWeight: 600 }}>autoconocimiento</span>,
                no un detector de mentiras. Ningún gesto, aislado, prueba nada sobre ti ni sobre nadie.
              </p>
              <p>
                Tus respuestas no te clasifican ni te diagnostican: solo te muestran una tendencia,
                un punto de partida para observarte con más honestidad, tal como propone el libro
                desde su primera página.
              </p>
              <p>
                Los módulos bonus ponen a prueba lo que sabes sobre microexpresiones e indicios,
                pero incluso ahí la lección más importante es la misma: un solo gesto es un rumor,
                nunca una sentencia. Usa lo que aprendas aquí para comprender, nunca para juzgar
                ni manipular a otra persona.
              </p>
            </div>
            <NavRow
              onBack={() => setScreen('intro')}
              backLabel="Portada"
              onNext={() => setScreen('map')}
              nextLabel="Entiendo, comenzar"
              nextDisabled={false}
            />
          </div>
        </div>
      )}

      {/* ---------------- MAP ---------------- */}
      {screen === 'map' && (
        <div className="flex-1 px-5 sm:px-8 pb-16 pt-8 max-w-3xl mx-auto w-full page-forward">
          <button
            onClick={() => setScreen('ethics')}
            className="inline-flex items-center gap-1.5 text-[12px] mb-6 focus:outline-none"
            style={{ color: '#5B6478' }}
          >
            <ChevronLeft size={14} /> Portada
          </button>

          <div className="text-center mb-8">
            <h2 className="font-display italic text-3xl mb-2" style={{ color: '#F0D479' }}>Tu mapa de observación</h2>
            <p className="text-sm max-w-md mx-auto" style={{ color: '#93A2C0' }}>
              Elige un nivel. En cada uno respondes una pregunta y marcas señales concretas para recibir un resumen personal.
            </p>
            <p className="text-[11px] mt-3" style={{ color: '#5B6478' }}>
              {completedModules.length} de {MODULES.length} completados
            </p>
          </div>

          <div className="grid sm:grid-cols-2 gap-3.5">
            {MODULES.filter((m) => m.type !== 'quiz').map((m) => {
              const idx = MODULES.indexOf(m);
              const done = completedModules.includes(m.id);
              const dominant = done ? getDominant(moduleScores[m.id]) : null;
              const Icon = m.Icon;
              return (
                <button
                  key={m.id}
                  onClick={() => startModule(idx)}
                  className="text-left rounded-2xl p-4 sm:p-5 transition-all duration-200 hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-[#D4AF37]"
                  style={{
                    background: done ? 'rgba(212,175,55,0.06)' : 'rgba(147,162,192,0.045)',
                    border: `1px solid ${done ? 'rgba(212,175,55,0.35)' : 'rgba(147,162,192,0.14)'}`,
                  }}
                >
                  <div className="flex items-start justify-between mb-3">
                    <div
                      className="w-10 h-10 rounded-full flex items-center justify-center"
                      style={{ background: 'rgba(212,175,55,0.14)', color: '#D4AF37' }}
                    >
                      <Icon size={18} />
                    </div>
                    {done && (
                      <span
                        className="flex items-center gap-1 text-[10px] uppercase tracking-wider font-semibold px-2 py-1 rounded-full"
                        style={{ background: `${TRAIT_INFO[dominant].color}22`, color: TRAIT_INFO[dominant].color }}
                      >
                        <Check size={11} /> {TRAIT_INFO[dominant].label}
                      </span>
                    )}
                  </div>
                  <h3 className="font-display text-lg leading-snug mb-1" style={{ color: '#EDE3C8' }}>{m.title}</h3>
                  <p className="text-[13px]" style={{ color: '#93A2C0' }}>{m.subtitle}</p>
                </button>
              );
            })}
          </div>

          <div className="flex items-center gap-3 mt-10 mb-4">
            <div className="h-px flex-1" style={{ background: 'rgba(212,175,55,0.25)' }} />
            <span className="text-[11px] tracking-[0.25em] uppercase font-semibold" style={{ color: '#D4AF37' }}>
              Módulos bonus
            </span>
            <div className="h-px flex-1" style={{ background: 'rgba(212,175,55,0.25)' }} />
          </div>
          <p className="text-[12px] text-center max-w-md mx-auto mb-5" style={{ color: '#93A2C0' }}>
            Microexpresiones, indicios, su combinación, y las señales de coqueteo — con corrección
            inmediata y explicación tomadas del libro.
          </p>

          <div className="grid sm:grid-cols-2 gap-3.5">
            {MODULES.filter((m) => m.type === 'quiz').map((m) => {
              const idx = MODULES.indexOf(m);
              const done = completedModules.includes(m.id);
              const Icon = m.Icon;
              return (
                <button
                  key={m.id}
                  onClick={() => startModule(idx)}
                  className="text-left rounded-2xl p-4 sm:p-5 transition-all duration-200 hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-[#D4AF37]"
                  style={{
                    background: done ? 'rgba(212,175,55,0.09)' : 'rgba(212,175,55,0.035)',
                    border: `1px solid ${done ? 'rgba(212,175,55,0.4)' : 'rgba(212,175,55,0.22)'}`,
                  }}
                >
                  <div className="flex items-start justify-between mb-3">
                    <div
                      className="w-10 h-10 rounded-full flex items-center justify-center"
                      style={{ background: 'rgba(212,175,55,0.16)', color: '#D4AF37' }}
                    >
                      <Icon size={18} />
                    </div>
                    {done && (
                      <span
                        className="flex items-center gap-1 text-[10px] uppercase tracking-wider font-semibold px-2 py-1 rounded-full"
                        style={{ background: 'rgba(212,175,55,0.18)', color: '#D4AF37' }}
                      >
                        <Check size={11} /> {moduleScores[m.id]?.correct}/{moduleScores[m.id]?.total}
                      </span>
                    )}
                  </div>
                  <h3 className="font-display text-lg leading-snug mb-1 flex items-center gap-2" style={{ color: '#EDE3C8' }}>
                    {m.title}
                    <span
                      className="text-[9px] uppercase tracking-wider font-semibold px-1.5 py-0.5 rounded"
                      style={{ background: 'rgba(212,175,55,0.22)', color: '#D4AF37' }}
                    >
                      Bonus
                    </span>
                  </h3>
                  <p className="text-[13px] font-semibold" style={{ color: '#D4AF37' }}>{m.subtitle}</p>
                </button>
              );
            })}
          </div>

          <button
            onClick={() => allDone && setScreen('final')}
            disabled={!allDone}
            className="w-full mt-6 rounded-2xl p-5 text-center transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-[#D4AF37]"
            style={{
              background: allDone ? 'linear-gradient(135deg, rgba(212,175,55,0.16), rgba(167,139,196,0.10))' : 'rgba(147,162,192,0.03)',
              border: `1px solid ${allDone ? 'rgba(212,175,55,0.4)' : 'rgba(147,162,192,0.08)'}`,
              cursor: allDone ? 'pointer' : 'default',
              opacity: allDone ? 1 : 0.55,
            }}
          >
            <p className="font-display italic text-xl mb-1" style={{ color: '#F0D479' }}>
              {allDone ? 'Ver tu reflejo final' : 'Tu reflejo final se revela al completar los 12 módulos'}
            </p>
            <p className="text-[12px]" style={{ color: '#93A2C0' }}>
              {allDone ? 'Un retrato de cómo habitas tu cuerpo, escrito a partir de tus respuestas.' : `Faltan ${MODULES.length - completedModules.length} módulo(s).`}
            </p>
          </button>
        </div>
      )}

      {/* ---------------- QUESTION ---------------- */}
      {screen === 'question' && (
        <div className="flex-1 flex flex-col px-5 sm:px-8 pb-10 pt-10 max-w-2xl mx-auto w-full">
          <div key={pageKey} className={`${pageClass} flex-1 flex flex-col`}>
            <div className="flex items-center gap-2 mb-1" style={{ color: '#D4AF37' }}>
              <currentModule.Icon size={15} />
              <span className="text-[11px] tracking-[0.2em] uppercase font-medium">
                Nivel {moduleIndex + 1} de {MODULES.length} · {currentModule.title}
              </span>
            </div>
            <p className="text-[11px] mb-6" style={{ color: '#5B6478' }}>
              Página {questionIndex + 1} de {currentModule.questions.length}
            </p>

            {currentModule.id === 'm7' && (
              <div
                className="rounded-2xl px-4 py-3 mb-5 text-left"
                style={{ background: 'rgba(201,123,147,0.09)', border: '1px solid rgba(201,123,147,0.28)' }}
              >
                <p className="text-[10px] uppercase tracking-[0.18em] font-semibold mb-1" style={{ color: '#C97B93' }}>
                  Nivel de relaciones
                </p>
                <p className="text-[13px] leading-relaxed" style={{ color: '#D7DCE8' }}>
                  Observa mirada, pies, postura, distancia, voz y contacto. Una señal sola no decide si existe interés, distancia o incomodidad: busca la combinación, compárala con el contexto y respeta siempre los límites de la otra persona.
                </p>
              </div>
            )}

            <h2 className="font-display text-2xl sm:text-3xl leading-snug mb-2" style={{ color: '#EDE3C8' }}>
              {currentQuestion.prompt}
            </h2>
            {isMulti && (
              <p className="text-[12px] mb-6 italic" style={{ color: '#93A2C0' }}>
                Marca todas las opciones que apliquen.
              </p>
            )}
            {!isMulti && <div className="mb-6" />}

            <div className="space-y-2.5">
              {currentQuestion.options.map((opt, i) => {
                const isSelected = isMulti
                  ? Array.isArray(currentAnswer) && currentAnswer.includes(i)
                  : currentAnswer === i;
                let bg = 'rgba(147,162,192,0.045)', border = 'rgba(147,162,192,0.14)', color = '#D7DCE8';
                if (isQuiz && checked) {
                  if (opt.correct) { bg = 'rgba(122,196,140,0.14)'; border = '#7AC48C'; color = '#B7E8C4'; }
                  else if (isSelected) { bg = 'rgba(201,116,74,0.14)'; border = '#C9744A'; color = '#E8B7A0'; }
                  else { bg = 'rgba(147,162,192,0.03)'; border = 'rgba(147,162,192,0.08)'; color = '#5B6478'; }
                } else if (isSelected) {
                  bg = 'rgba(212,175,55,0.14)'; border = '#D4AF37'; color = '#F0D479';
                }
                return (
                  <button
                    key={i}
                    onClick={() => selectOption(i)}
                    disabled={isQuiz && checked}
                    className="w-full text-left rounded-xl px-4 py-3.5 text-[14px] leading-snug transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-[#D4AF37] flex items-center justify-between gap-3"
                    style={{ background: bg, border: `1px solid ${border}`, color, cursor: isQuiz && checked ? 'default' : 'pointer' }}
                  >
                    <span>{opt.text}</span>
                    {isQuiz && checked && opt.correct && <Check size={16} className="shrink-0" style={{ color: '#7AC48C' }} />}
                    {isQuiz && checked && isSelected && !opt.correct && <XIcon size={16} className="shrink-0" style={{ color: '#C9744A' }} />}
                    {isMulti && !checked && (
                      <span
                        className="w-4 h-4 rounded shrink-0 flex items-center justify-center"
                        style={{ border: `1.5px solid ${isSelected ? '#D4AF37' : 'rgba(147,162,192,0.35)'}`, background: isSelected ? '#D4AF37' : 'transparent' }}
                      >
                        {isSelected && <Check size={11} style={{ color: '#0A1428' }} />}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>

            {(() => {
              const dynamic = getLevelDynamic(currentModule, questionIndex);
              const renderMarks = (type, options) => options.map((option) => {
                const selected = currentDynamicMarks[type].includes(option);
                return (
                  <div key={option}>
                    <button onClick={() => toggleDynamicMark(type, option)} className="w-full flex items-center gap-2 text-left rounded-xl px-3 py-3 text-[12px] transition-all focus:outline-none focus:ring-2 focus:ring-[#D4AF37]" style={{ background: selected ? 'rgba(212,175,55,0.16)' : 'rgba(147,162,192,0.045)', border: `1px solid ${selected ? '#D4AF37' : 'rgba(147,162,192,0.16)'}`, color: selected ? '#F0D479' : '#D7DCE8' }}>
                      <span className="w-4 h-4 rounded flex items-center justify-center shrink-0" style={{ border: `1px solid ${selected ? '#D4AF37' : '#5B6478'}`, background: selected ? '#D4AF37' : 'transparent' }}>{selected && <Check size={11} style={{ color: '#0A1428' }} />}</span>
                      {option}
                    </button>
                    {selected && <p className="px-3 py-2 text-[11px] leading-relaxed" style={{ color: type === 'perceive' ? '#B9CFE8' : '#B7E8C4' }}>{getDynamicReading(type, option)}</p>}
                  </div>
                );
              });
              return (
                <div className="mt-6 grid gap-4 text-left">
                  <div className="rounded-2xl p-4" style={{ background: 'rgba(110,155,199,0.08)', border: '1px solid rgba(110,155,199,0.3)' }}>
                    <p className="text-[10px] uppercase tracking-[0.18em] font-semibold mb-2" style={{ color: '#6E9BC7' }}>A · Lo que percibes</p>
                    <p className="text-[13px] leading-relaxed mb-3" style={{ color: '#D7DCE8' }}>{dynamic.perceive}</p>
                    <div className="grid sm:grid-cols-2 gap-2">{renderMarks('perceive', dynamic.options)}</div>
                    <p className="text-[11px] mt-3" style={{ color: '#93A2C0' }}>{currentDynamicMarks.perceive.length} señales percibidas</p>
                  </div>
                  <div className="rounded-2xl p-4" style={{ background: 'rgba(122,196,140,0.08)', border: '1px solid rgba(122,196,140,0.3)' }}>
                    <p className="text-[10px] uppercase tracking-[0.18em] font-semibold mb-2" style={{ color: '#7AC48C' }}>B · Cómo actuarías tú</p>
                    <p className="text-[13px] leading-relaxed mb-3" style={{ color: '#D7DCE8' }}>{dynamic.act}</p>
                    <div className="grid sm:grid-cols-2 gap-2">{renderMarks('act', dynamic.actions)}</div>
                    <p className="text-[11px] mt-3" style={{ color: '#93A2C0' }}>{currentDynamicMarks.act.length} respuestas personales</p>
                  </div>
                  {hasDynamicMarks && <div className="rounded-xl px-4 py-3" style={{ background: 'rgba(212,175,55,0.06)', border: '1px solid rgba(212,175,55,0.2)' }}><p className="text-[10px] uppercase tracking-wider font-semibold mb-2" style={{ color: '#D4AF37' }}>Lectura de esta hoja</p><p className="text-[12px] leading-relaxed" style={{ color: '#D7DCE8' }}>Percibes: {currentDynamicMarks.perceive.join(', ') || 'ninguna señal todavía'}. Tu respuesta: {currentDynamicMarks.act.join(', ') || 'ninguna marcada todavía'}. Úsalo como preparación para observar y actuar con más claridad.</p></div>}
                </div>
              );
            })()}

            {isQuiz && checked && (
              <div
                className="mt-4 rounded-xl px-4 py-3.5 text-[13px] leading-relaxed"
                style={{ background: 'rgba(212,175,55,0.06)', border: '1px solid rgba(212,175,55,0.2)', color: '#D7DCE8' }}
              >
                <span className="text-[10px] uppercase tracking-wider font-semibold block mb-1.5" style={{ color: '#D4AF37' }}>
                  Por qué
                </span>
                {currentQuestion.explanation}
              </div>
            )}

            <NavRow
              onBack={goBackQuestion}
              backLabel={questionIndex === 0 ? 'Al mapa' : 'Atrás'}
              onNext={goForwardQuestion}
              nextDisabled={!canContinue}
              nextLabel={
                isQuiz && !checked
                  ? 'Verificar respuesta'
                  : questionIndex === currentModule.questions.length - 1
                  ? 'Terminar nivel'
                  : 'Siguiente'
              }
            />
          </div>
        </div>
      )}

      {/* ---------------- MODULE SUMMARY ---------------- */}
      {screen === 'moduleSummary' && (
        <div className="flex-1 flex items-center justify-center px-5 sm:px-8 pb-10 pt-10 max-w-xl mx-auto w-full">
          <div key={pageKey} className={`${pageClass} w-full text-center`}>
            <span className="text-[11px] tracking-[0.25em] uppercase font-medium" style={{ color: '#D4AF37' }}>
              Cae el telón · {currentModule.title}
            </span>
            {currentModule.type === 'quiz' ? (() => {
              const { correct, total } = moduleScores[currentModule.id] || { correct: 0, total: 5 };
              const msg = correct === total
                ? 'Ojo clínico. Lees los racimos de señales, no gestos sueltos, que es justo la diferencia entre un observador casual y uno entrenado.'
                : correct >= total - 2
                ? 'Buen observador. Sigue practicando: la clave siempre está en combinar tres indicios, nunca en juzgar uno solo.'
                : 'Ir despacio también es parte del entrenamiento. Vuelve al nivel de emociones y repasa cómo se combinan microexpresión, gesto y contexto.';
              const missed = currentModule.questions
                .map((_, qi) => qi)
                .filter((qi) => !isQuestionCorrect(currentModule, qi, answers[qi]));
              return (
                <>
                  <h2 className="font-display italic text-3xl my-5" style={{ color: '#D4AF37' }}>{correct} de {total} aciertos</h2>
                  <p className="text-[15px] leading-relaxed mb-6" style={{ color: '#D7DCE8' }}>{msg}</p>
                  {missed.length > 0 && (
                    <div className="text-left rounded-xl px-5 py-4 mb-8" style={{ background: 'rgba(212,175,55,0.06)', border: '1px solid rgba(212,175,55,0.2)' }}>
                      <span className="flex items-center gap-1.5 text-[10px] uppercase tracking-wider font-semibold mb-3" style={{ color: '#D4AF37' }}>
                        <Lightbulb size={12} /> En qué seguir trabajando
                      </span>
                      <div className="space-y-3">
                        {missed.map((qi) => (
                          <p key={qi} className="text-[13px] leading-relaxed" style={{ color: '#B9C2D6' }}>
                            {currentModule.questions[qi].explanation}
                          </p>
                        ))}
                      </div>
                    </div>
                  )}
                </>
              );
            })() : (() => {
              const dominant = getDominant(moduleScores[currentModule.id]);
              const info = dominant
                ? TRAIT_INFO[dominant]
                : {
                    color: '#D4AF37',
                    mirrorTitle: 'Tu patrón de observación',
                    text: () => 'Has construido este nivel a partir de las señales que reconociste. Observa cómo se combinan y confirma siempre su significado con el contexto, la conversación y los límites de la otra persona.'
                  };
              return (
                <>
                  <h2 className="font-display italic text-3xl my-5" style={{ color: info.color }}>{info.mirrorTitle}</h2>
                  <p className="text-[15px] leading-relaxed mb-8" style={{ color: '#D7DCE8' }}>
                    {info.text(currentModule.theme)}
                  </p>
                </>
              );
            })()}

            <div
              className="text-left rounded-2xl px-5 py-4 mb-6"
              style={{ background: 'rgba(147,162,192,0.045)', border: '1px solid rgba(147,162,192,0.14)' }}
            >
              <span className="text-[10px] uppercase tracking-wider font-semibold" style={{ color: '#D4AF37' }}>
                Resumen de este nivel
              </span>
              <p className="text-[13px] leading-relaxed mt-2" style={{ color: '#D7DCE8' }}>
                {getLevelSummary(currentModule, moduleScores[currentModule.id], getAllDynamicMarks(currentModule.id))}
              </p>
              {(() => {
                const assessment = getDynamicAssessment(
                  getAllDynamicMarks(currentModule.id).perceive,
                  getAllDynamicMarks(currentModule.id).act
                );
                return (
                  <div className="mt-3 space-y-2 text-[12px] leading-relaxed" style={{ color: '#B9C2D6' }}>
                    <p><strong style={{ color: '#6E9BC7' }}>Lo que percibiste:</strong> {assessment.perceptionText}</p>
                    <p><strong style={{ color: '#7AC48C' }}>Cómo actuarías:</strong> {assessment.actionText}</p>
                    <p><strong style={{ color: '#D4AF37' }}>Evaluación:</strong> {assessment.coherence}</p>
                  </div>
                );
              })()}
              <p className="text-[11px] mt-3" style={{ color: '#93A2C0' }}>
                {BOOK_PARTS[currentModule.id]} · Las señales orientan una conversación contigo; no son un diagnóstico.
              </p>
            </div>

            {(() => {
              const sections = getLevelSections(currentModule, getAllDynamicMarks(currentModule.id));
              return (
                <div className="grid gap-3 text-left mb-6">
                  <div className="rounded-2xl px-5 py-4" style={{ background: 'rgba(110,155,199,0.08)', borderLeft: '3px solid #6E9BC7' }}>
                    <p className="text-[10px] uppercase tracking-wider font-semibold mb-2" style={{ color: '#6E9BC7' }}>1 · Lo que identificaste</p>
                    <p className="text-[13px] leading-relaxed" style={{ color: '#D7DCE8' }}>{sections.identified}</p>
                  </div>
                  <div className="rounded-2xl px-5 py-4" style={{ background: 'rgba(212,175,55,0.07)', borderLeft: '3px solid #D4AF37' }}>
                    <p className="text-[10px] uppercase tracking-wider font-semibold mb-2" style={{ color: '#D4AF37' }}>2 · Qué puede significar</p>
                    <p className="text-[13px] leading-relaxed" style={{ color: '#D7DCE8' }}>{sections.meaning}</p>
                  </div>
                  <div className="rounded-2xl px-5 py-4" style={{ background: 'rgba(122,196,140,0.08)', borderLeft: '3px solid #7AC48C' }}>
                    <p className="text-[10px] uppercase tracking-wider font-semibold mb-2" style={{ color: '#7AC48C' }}>3 · Cómo actuar o prepararte</p>
                    <p className="text-[13px] leading-relaxed" style={{ color: '#D7DCE8' }}>{sections.action}</p>
                  </div>
                </div>
              );
            })()}

            {currentModule.type !== 'quiz' && (
              <div className="flex justify-center flex-wrap gap-1.5 mb-4">
                {Object.entries(moduleScores[currentModule.id] || {}).map(([k, v]) => (
                  <span
                    key={k}
                    className="text-[10px] uppercase tracking-wider font-semibold px-2.5 py-1 rounded-full"
                    style={{ background: `${TRAIT_INFO[k].color}22`, color: TRAIT_INFO[k].color }}
                  >
                    {TRAIT_INFO[k].label} · {v}
                  </span>
                ))}
              </div>
            )}

            <NavRow
              onBack={backToLastQuestion}
              backLabel="Revisar respuestas"
              onNext={goNextModuleOrFinal}
              nextLabel={allDone ? 'Ver mi reflejo final' : 'Siguiente módulo'}
            />
          </div>
        </div>
      )}

      {/* ---------------- FINAL ---------------- */}
      {screen === 'final' && (() => {
        const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
        const [top1] = sorted[0];
        const [top2] = sorted[1];
        const maxVal = Math.max(...Object.values(scores), 4);
        const radarData = Object.entries(scores).map(([k, v]) => ({ trait: TRAIT_INFO[k].label, value: v, full: maxVal }));
        const top1Info = TRAIT_INFO[top1];
        const top2Info = TRAIT_INFO[top2];
        const top2Text = top2Info.text('varios momentos de este recorrido');

        return (
          <div className="flex-1 px-5 sm:px-8 pb-16 pt-8 max-w-2xl mx-auto w-full page-forward">
            <button
              onClick={() => setScreen('map')}
              className="inline-flex items-center gap-1.5 text-[12px] mb-4 focus:outline-none"
              style={{ color: '#5B6478' }}
            >
              <ChevronLeft size={14} /> Volver al mapa
            </button>

            <div className="text-center mb-2">
              <span className="text-[11px] tracking-[0.25em] uppercase font-medium" style={{ color: '#5B6478' }}>Tu reflejo</span>
            </div>

            <div className="flex justify-center my-8">
              <div
                className="relative w-64 h-64 sm:w-72 sm:h-72 rounded-full flex items-center justify-center text-center px-8"
                style={{
                  background: `radial-gradient(circle at 35% 30%, rgba(255,255,255,0.08), rgba(255,255,255,0) 45%), radial-gradient(circle, ${top1Info.color}22 0%, #0C1730 70%)`,
                  border: `1px solid ${top1Info.color}55`,
                  boxShadow: `0 0 60px ${top1Info.color}1f, inset 0 0 40px rgba(0,0,0,0.4)`,
                }}
              >
                <p className="font-display italic text-2xl sm:text-[28px] leading-tight" style={{ color: top1Info.color }}>
                  {top1Info.mirrorTitle}
                </p>
              </div>
            </div>

            <p className="text-[15px] leading-relaxed text-center max-w-md mx-auto mb-3" style={{ color: '#D7DCE8' }}>
              {top1Info.text('tu forma general de habitar el cuerpo')}
            </p>
            <p className="text-[13px] leading-relaxed text-center max-w-md mx-auto mb-10" style={{ color: '#93A2C0' }}>
              Muy cerca aparece también <span style={{ color: top2Info.color }}>{top2Info.label.toLowerCase()}</span>: {top2Text.charAt(0).toLowerCase() + top2Text.slice(1)}
            </p>

            <div className="h-64 sm:h-72 mb-10">
              <ResponsiveContainer width="100%" height="100%">
                <RadarChart data={radarData} outerRadius="70%">
                  <PolarGrid stroke="rgba(147,162,192,0.16)" />
                  <PolarAngleAxis dataKey="trait" tick={{ fill: '#93A2C0', fontSize: 12 }} />
                  <Radar dataKey="value" stroke="#D4AF37" fill="#D4AF37" fillOpacity={0.28} strokeWidth={2} />
                </RadarChart>
              </ResponsiveContainer>
            </div>

            <h3 className="font-display italic text-xl mb-4 text-center" style={{ color: '#F0D479' }}>Módulo a módulo</h3>
            <div className="space-y-2 mb-10">
              {MODULES.map((m) => {
                const isQuiz = m.type === 'quiz';
                const dom = isQuiz ? null : getDominant(moduleScores[m.id]);
                const info = dom ? TRAIT_INFO[dom] : null;
                const levelSummary = moduleScores[m.id]
                  ? getLevelSummary(m, moduleScores[m.id], getAllDynamicMarks(m.id))
                  : 'Nivel pendiente.';
                const levelSections = getLevelSections(m, getAllDynamicMarks(m.id));
                return (
                  <div
                    key={m.id}
                    className="rounded-xl px-4 py-3"
                    style={{ background: 'rgba(147,162,192,0.035)', border: '1px solid rgba(147,162,192,0.1)' }}
                  >
                    <div className="flex items-center justify-between gap-2.5">
                      <div className="flex items-center gap-2.5">
                        <m.Icon size={15} style={{ color: '#5B6478' }} />
                        <span className="text-[13px]" style={{ color: '#D7DCE8' }}>{m.title}</span>
                      </div>
                      {info && (
                        <span
                          className="text-[10px] uppercase tracking-wider font-semibold px-2.5 py-1 rounded-full shrink-0"
                          style={{ background: `${info.color}22`, color: info.color }}
                        >
                          {info.label}
                        </span>
                      )}
                      {isQuiz && moduleScores[m.id] && (
                        <span
                          className="text-[10px] uppercase tracking-wider font-semibold px-2.5 py-1 rounded-full shrink-0"
                          style={{ background: 'rgba(212,175,55,0.18)', color: '#D4AF37' }}
                        >
                          {moduleScores[m.id].correct}/{moduleScores[m.id].total} aciertos
                        </span>
                      )}
                    </div>
                    <p className="text-[12px] leading-relaxed mt-2" style={{ color: '#B9C2D6' }}>{levelSummary}</p>
                    {moduleScores[m.id] && <p className="text-[12px] leading-relaxed mt-2" style={{ color: '#9ED9AC' }}><strong>Cómo actuar:</strong> {levelSections.action}</p>}
                  </div>
                );
              })}
            </div>

            <NavRow
              onBack={() => setScreen('map')}
              backLabel="Volver al mapa"
              onNext={() => setScreen('closing')}
              nextDisabled={false}
              nextLabel="Continuar"
            />
          </div>
        );
      })()}

      {/* ---------------- CLOSING / MARKETING ---------------- */}
      {screen === 'closing' && (
        <div className="flex-1 flex items-center justify-center px-6 py-16 max-w-lg mx-auto w-full page-forward">
          <div className="w-full text-center">
            <div
              className="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-6"
              style={{ background: 'rgba(212,175,55,0.14)', color: '#D4AF37' }}
            >
              <Sparkles size={20} />
            </div>
            <h2 className="font-display italic text-3xl mb-5" style={{ color: '#F0D479' }}>
              Gracias por mirarte con honestidad
            </h2>
            <p className="text-[14.5px] leading-relaxed mb-6" style={{ color: '#D7DCE8' }}>
              Has recorrido decenas de escenas de tu propia vida y has elegido, cada vez,
              responder desde lo que realmente hace tu cuerpo y no desde lo que crees que
              "debería" hacer. Ese gesto —el de observarte sin juzgarte— es exactamente el que
              proponíamos al abrir este libro. El viaje no termina aquí: sigue cada vez que te
              sorprendas a ti mismo cruzando los brazos, aguantando una sonrisa o buscando la
              salida con los pies.
            </p>

            <div
              className="rounded-2xl p-6 text-center mb-8"
              style={{ background: 'linear-gradient(135deg, rgba(212,175,55,0.14), rgba(167,139,196,0.08))', border: '1px solid rgba(212,175,55,0.3)' }}
            >
              <BookHeart size={20} className="mx-auto mb-3" style={{ color: '#D4AF37' }} />
              <p className="font-display italic text-lg mb-2" style={{ color: '#F0D479' }}>
                Esta app es solo el eco de un libro más grande
              </p>
              <p className="text-[13.5px] leading-relaxed mb-4" style={{ color: '#D7DCE8' }}>
                Todo lo que respondiste aquí viene de <em>Conócete: el lenguaje secreto de tu cuerpo</em>,
                donde cada capítulo profundiza mucho más: entrevistas, negociaciones, pareja, poder,
                pérdida y despedida. Si esta experiencia te dijo algo sobre ti, el libro completo
                te dirá mucho más.
              </p>
              <a
                href="https://www.conocete.com"
                target="_blank"
                rel="noopener noreferrer"
                className="inline-flex items-center gap-2 font-semibold text-sm px-6 py-3 rounded-full transition-transform hover:scale-[1.02]"
                style={{ background: 'linear-gradient(135deg, #C9A227, #E8C860)', color: '#0A1428' }}
              >
                Consigue el libro en conocete.com <ChevronRight size={16} />
              </a>
            </div>

            <p className="text-[11px] tracking-wide mb-10" style={{ color: '#5B6478' }}>
              Yoeldis Castillo Quiala, Psicólogo · Junior Coronel Durán<br />
              Autores de «Conócete: el lenguaje secreto de tu cuerpo» · @conocete.app
            </p>

            <div className="flex justify-center gap-3">
              <button
                onClick={() => setScreen('final')}
                className="inline-flex items-center gap-1.5 text-sm px-6 py-3 rounded-full border transition-colors focus:outline-none focus:ring-2 focus:ring-[#D4AF37]"
                style={{ borderColor: 'rgba(147,162,192,0.25)', color: '#D7DCE8' }}
              >
                <ChevronLeft size={15} /> Volver a tu reflejo
              </button>
              <button
                onClick={resetAll}
                className="inline-flex items-center gap-2 font-semibold text-sm px-6 py-3 rounded-full transition-transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-[#D4AF37]"
                style={{ background: 'linear-gradient(135deg, #C9A227, #E8C860)', color: '#0A1428' }}
              >
                <RotateCcw size={15} /> Empezar de nuevo
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
